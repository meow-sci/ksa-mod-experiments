openapi: 3.1.0

info:
  title: Unladen Swallow — Blinky API
  version: 2.0.0
  description: >
    Blinky LCD pixel grid control and management endpoints for the Unladen Swallow
    RPC server. Covers grid lifecycle (build, scan, destroy), display control
    (scroll, static, patterns, off), render settings, and non-LCD engine management.
    Listens on http://localhost:7887.

servers:
  - url: http://localhost:7887
    description: Local KSA mod server

paths:

  # ── Grid Management ─────────────────────────────────────────────────────────

  /blinky/grids:

    get:
      summary: List registered LCD grids
      description: >
        Returns every currently registered Blinky LCD grid across all vehicles.
        An optional `vehicleId` query parameter narrows the result to grids on
        that vehicle. Each entry includes dimensions, ownership, and scroll state.
      operationId: blinkyListGrids
      parameters:
        - name: vehicleId
          in: query
          required: false
          schema:
            type: string
          description: When provided, only grids belonging to this vehicle are returned.
          example: "rocket-1"
      responses:
        '200':
          description: Array of registered grids (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyGridListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Build a new pixel grid on a vehicle
      description: >
        Creates a new named Blinky LCD pixel grid on the specified vehicle.
        Each pixel consists of two opposing engine parts that produce net-zero
        thrust. The grid is automatically registered with the grid manager after
        creation.


        If a grid with the same name already exists for the vehicle, the request
        is rejected with 409 Conflict.
      operationId: blinkyBuildGrid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyBuildGridRequest'
      responses:
        '200':
          description: Grid built and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyGridInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Destroy a pixel grid
      description: >
        Destroys the named Blinky LCD pixel grid on the specified vehicle.
        Owned grids (built via API) have their pixel engine parts removed from
        the vehicle. Scanned grids are only unregistered — their parts remain.
        The response `action` field indicates which occurred: `"grid_destroyed"`
        or `"grid_unregistered"`.
      operationId: blinkyDestroyGrid
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
          description: Vehicle that owns the grid.
          example: "rocket-1"
        - name: gridName
          in: query
          required: true
          schema:
            type: string
          description: Name of the grid to destroy.
          example: "main"
      responses:
        '200':
          description: Grid destroyed or unregistered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/grids/scan:
    post:
      summary: Scan a vehicle for an existing pixel grid
      description: >
        Scans the specified vehicle for an existing pixel grid and registers it
        under the given name. Two scan modes are supported:


        - **ID-based** (default): Finds parts whose IDs match the
          `pixel_{gridName}_{row}_{col}_{a|b}` naming convention. Use this for
          grids previously built via the API.

        - **Template-based**: When `enginePartId` is provided, finds small-scale
          engine parts matching that template. Use this for grids created outside
          the API or loaded from save files.


        Returns the discovered grid info on success, or 404 if no matching grid
        is found.
      operationId: blinkyScanGrid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyScanGridRequest'
      responses:
        '200':
          description: Grid found and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyGridInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/grids/scan-all:
    post:
      summary: Scan all vehicles for pixel grids
      description: >
        Discovers Blinky pixel grids across every vehicle in the current system.
        Uses ID-based scanning (parts named `pixel_{gridName}_{row}_{col}_{a|b}`)
        and registers all found grids automatically.


        Returns a summary with the total number of discovered grids and their names.
      operationId: blinkyScanAllGrids
      responses:
        '200':
          description: Scan completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyScanAllResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Display Control ──────────────────────────────────────────────────────────

  /blinky/animate:

    post:
      summary: Start scroll animation
      description: >
        Starts a scrolling pixel animation on the named grid. The pixel array
        defines the pattern that scrolls across the grid. `speed` controls the
        rate in pixels per second (must be > 0). Any existing scroll is stopped
        and all pixels are turned off before the new animation starts.
      operationId: blinkyAnimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyScrollRequest'
      responses:
        '200':
          description: Scroll started. `data.action` = `"scroll_started"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Stop scroll animation
      description: >
        Stops any running scroll animation on the named grid without turning off
        pixels. Pixels remain in their last-rendered state. Use `POST /blinky/off`
        to also clear pixels.
      operationId: blinkyStopScroll
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
          description: Vehicle that owns the grid.
          example: "rocket-1"
        - name: gridName
          in: query
          required: true
          schema:
            type: string
          description: Name of the grid.
          example: "main"
      responses:
        '200':
          description: Scroll stopped. `data.action` = `"scroll_stopped"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/animate/builtin:
    post:
      summary: Start built-in scroll animation
      description: >
        Starts the built-in default pixel pattern animation on the named grid.
        Uses the pre-defined pixel data embedded in the blinky library. `speed`
        controls the scroll rate in pixels per second.
      operationId: blinkyAnimateBuiltin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyBuiltInScrollRequest'
      responses:
        '200':
          description: Built-in scroll started. `data.action` = `"builtin_scroll_started"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/static:
    post:
      summary: Display static pixels
      description: >
        Displays a static set of lit pixels on the named grid. Stops any running
        scroll animation first.


        When `reset` is `true`, the grid performs an intelligent diff — turning
        off pixels that are no longer needed and turning on new ones (replace
        mode). When `false`, supplied pixels are OR-ed onto the current state
        (additive mode).
      operationId: blinkyStatic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyStaticRequest'
      responses:
        '200':
          description: >
            Pixels applied. `data.action` = `"static_reset"` or `"static_additive"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/pattern:
    post:
      summary: Apply a named pattern
      description: >
        Applies a built-in pixel pattern to the named grid. Stops any running
        scroll animation before applying.
      operationId: blinkyPattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyPatternRequest'
      responses:
        '200':
          description: >
            Pattern applied. `data.action` = `"pattern_<name>"` (e.g. `"pattern_checkerboard"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/off:
    post:
      summary: Turn off all pixels
      description: >
        Turns off every pixel on the named grid and stops any running scroll
        animation.
      operationId: blinkyOff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyOffRequest'
      responses:
        '200':
          description: All pixels off. `data.action` = `"off"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Settings ─────────────────────────────────────────────────────────────────

  /blinky/render:

    get:
      summary: Get render settings
      description: >
        Returns the current Blinky render settings, including whether pixel
        engine part meshes are visible.
      operationId: blinkyGetRender
      responses:
        '200':
          description: Current render settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyRenderSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Set render settings
      description: >
        Updates Blinky render settings. Currently controls whether pixel engine
        part meshes are rendered (visible) or hidden via Harmony patching.
      operationId: blinkySetRender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyRenderSettingsRequest'
      responses:
        '200':
          description: Settings updated. Returns new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyRenderSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /blinky/engines/deactivate:
    post:
      summary: Deactivate non-LCD engines
      description: >
        Deactivates all engine controllers on the specified vehicle that are
        NOT part of any Blinky LCD pixel grid. Useful for shutting down
        propulsion engines that would interfere with pixel display testing.
      operationId: blinkyDeactivateEngines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlinkyEngineDeactivateRequest'
      responses:
        '200':
          description: Non-LCD engines deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlinkyResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  schemas:

    # ── Shared types ───────────────────────────────────────────────────────────

    PixelCoord:
      type: object
      description: >
        A single pixel coordinate on the LCD grid. `x` is the column index,
        `y` is the row index, both zero-based.
      properties:
        x:
          type: integer
          description: Column index (zero-based).
          example: 3
        y:
          type: integer
          description: Row index (zero-based).
          example: 7
      required: [x, y]

    GridLayout:
      type: string
      description: >
        Grid geometry mode. `"flat"` arranges pixels in a plane (columns along
        X, rows along -Y). `"cylinder"` wraps columns around a cylindrical
        surface with rows stacking along Y.
      enum: [flat, cylinder]
      example: "flat"

    BlinkyPattern:
      type: string
      description: >
        Named pixel pattern. `"allOn"` lights every pixel, `"allOff"` clears
        the grid, `"checkerboard"` alternates on/off in a checkerboard,
        `"altRows"` lights even rows, `"altCols"` lights even columns.
      enum: [allOn, allOff, checkerboard, altRows, altCols]
      example: "checkerboard"

    # ── Grid management request types ─────────────────────────────────────────

    BlinkyBuildGridRequest:
      type: object
      description: >
        Request body for building a new pixel grid. Only `vehicleId` and
        `gridName` are required; all configuration fields default to sensible
        values when omitted.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: >
            Name for the new grid. Allowed characters: `a-z`, `A-Z`, `0-9`,
            `-` (hyphen). Underscores are reserved.
          pattern: '^[a-zA-Z0-9-]+$'
          example: "main"
        width:
          type: integer
          description: Number of pixel columns.
          minimum: 1
          maximum: 256
          default: 16
          example: 16
        height:
          type: integer
          description: Number of pixel rows.
          minimum: 1
          maximum: 256
          default: 8
          example: 8
        layout:
          $ref: '#/components/schemas/GridLayout'
          default: "flat"
        spacing:
          type: number
          format: float
          description: Distance in metres between pixel centres.
          minimum: 0.1
          maximum: 100.0
          default: 5.0
          example: 5.0
        offsetX:
          type: number
          format: float
          description: X offset from vehicle root (metres, right).
          default: 0.0
          example: 0.0
        offsetY:
          type: number
          format: float
          description: Y offset from vehicle root (metres, up).
          default: 5.0
          example: 5.0
        offsetZ:
          type: number
          format: float
          description: Z offset from vehicle root (metres, forward).
          default: 2.0
          example: 2.0
        enginePartId:
          type: string
          description: >
            Engine part template ID. Defaults to A3 engine. Common values:
            `CorePropulsionA_Prefab_EngineA1` through `A6`.
          default: "CorePropulsionA_Prefab_EngineA3"
          example: "CorePropulsionA_Prefab_EngineA3"
        partScale:
          type: number
          format: double
          description: Scale multiplier for pixel parts (smaller = less visible).
          minimum: 0.001
          maximum: 1.0
          default: 0.010
          example: 0.010
      required: [vehicleId, gridName]

    BlinkyScanGridRequest:
      type: object
      description: >
        Request body for scanning a single vehicle for an existing pixel grid.
        Omit `enginePartId` for ID-based scanning; provide it for
        template-based scanning.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Name to register the scanned grid under.
          pattern: '^[a-zA-Z0-9-]+$'
          example: "main"
        enginePartId:
          type: string
          description: >
            Engine template ID for template-based scanning. When omitted,
            ID-based scanning is used instead.
          example: "CorePropulsionA_Prefab_EngineA3"
      required: [vehicleId, gridName]

    # ── Display control request types ─────────────────────────────────────────

    BlinkyScrollRequest:
      type: object
      description: Start a scrolling pixel animation on a grid.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Target grid name.
          example: "main"
        pixels:
          type: array
          description: Pixel coordinates that form the scroll pattern.
          items:
            $ref: '#/components/schemas/PixelCoord'
          minItems: 1
        speed:
          type: number
          format: float
          description: Scroll speed in pixels per second (must be > 0).
          exclusiveMinimum: 0
          example: 2.5
      required: [vehicleId, gridName, pixels, speed]

    BlinkyBuiltInScrollRequest:
      type: object
      description: Start the built-in default scroll animation on a grid.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Target grid name.
          example: "main"
        speed:
          type: number
          format: float
          description: Scroll speed in pixels per second (must be > 0).
          exclusiveMinimum: 0
          default: 3.0
          example: 3.0
      required: [vehicleId, gridName, speed]

    BlinkyStaticRequest:
      type: object
      description: Display a static set of lit pixels on a grid.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Target grid name.
          example: "main"
        pixels:
          type: array
          description: Pixel coordinates to light up.
          items:
            $ref: '#/components/schemas/PixelCoord'
        reset:
          type: boolean
          description: >
            `true` = replace mode (diff against current state).
            `false` = additive mode (OR onto current state).
          example: true
      required: [vehicleId, gridName, pixels, reset]

    BlinkyPatternRequest:
      type: object
      description: Apply a named built-in pattern to a grid.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Target grid name.
          example: "main"
        pattern:
          $ref: '#/components/schemas/BlinkyPattern'
      required: [vehicleId, gridName, pattern]

    BlinkyOffRequest:
      type: object
      description: Turn off all pixels on a grid.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
        gridName:
          type: string
          description: Target grid name.
          example: "main"
      required: [vehicleId, gridName]

    # ── Settings request types ─────────────────────────────────────────────────

    BlinkyRenderSettingsRequest:
      type: object
      description: Update Blinky render settings.
      properties:
        renderPixelParts:
          type: boolean
          description: >
            `true` = show pixel engine part meshes.
            `false` = hide via Harmony patch (default).
          example: false
      required: [renderPixelParts]

    BlinkyEngineDeactivateRequest:
      type: object
      description: Identifies the vehicle whose non-LCD engines will be deactivated.
      properties:
        vehicleId:
          type: string
          description: Target vehicle identifier.
          example: "rocket-1"
      required: [vehicleId]

    # ── Response data types ────────────────────────────────────────────────────

    BlinkyResult:
      type: object
      description: Result of a Blinky operation.
      properties:
        vehicleId:
          type: string
          example: "rocket-1"
        gridName:
          type: string
          example: "main"
        action:
          type: string
          description: >
            Describes what happened. Values: `"scroll_started"`,
            `"builtin_scroll_started"`, `"scroll_stopped"`, `"static_reset"`,
            `"static_additive"`, `"off"`, `"pattern_<name>"`,
            `"grid_destroyed"`, `"grid_unregistered"`,
            `"engines_deactivated"`.
          example: "scroll_started"
      required: [vehicleId, gridName, action]

    BlinkyGridInfo:
      type: object
      description: Detailed information about a registered Blinky LCD grid.
      properties:
        vehicleId:
          type: string
          description: Vehicle that owns the grid.
          example: "rocket-1"
        gridName:
          type: string
          description: Registered grid name.
          example: "main"
        rows:
          type: integer
          description: Number of pixel rows.
          example: 8
        cols:
          type: integer
          description: Number of pixel columns.
          example: 16
        pixelCount:
          type: integer
          description: Total pixel pairs (rows × cols).
          example: 128
        isOwned:
          type: boolean
          description: >
            `true` if built dynamically (parts will be removed on destroy).
            `false` if scanned from existing parts.
          example: true
        isScrolling:
          type: boolean
          description: Whether a scroll animation is running.
          example: false
        scrollSpeed:
          type: number
          format: float
          description: Current scroll speed (0 when not scrolling).
          example: 0.0
      required:
        - vehicleId
        - gridName
        - rows
        - cols
        - pixelCount
        - isOwned
        - isScrolling
        - scrollSpeed

    BlinkyScanAllResult:
      type: object
      description: Summary of a scan-all-vehicles operation.
      properties:
        discovered:
          type: integer
          description: Total number of newly discovered and registered grids.
          example: 3
        grids:
          type: array
          description: >
            Human-readable labels for each discovered grid (e.g.
            `"main on rocket-1"`).
          items:
            type: string
          example: ["main on rocket-1", "display on sat-2"]
      required: [discovered, grids]

    BlinkyRenderSettings:
      type: object
      description: Current Blinky render settings.
      properties:
        renderPixelParts:
          type: boolean
          description: Whether pixel engine part meshes are currently rendered.
          example: false
      required: [renderPixelParts]

    # ── Response wrappers ──────────────────────────────────────────────────────

    ApiResponseBase:
      type: object
      description: Standard API envelope for successful responses.
      properties:
        status:
          type: string
          description: Always `"ok"`.
          example: "ok"
        data:
          description: Endpoint-specific payload.
      required: [status, data]

    BlinkyResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BlinkyResult'

    BlinkyGridInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BlinkyGridInfo'

    BlinkyGridListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BlinkyGridInfo'

    BlinkyScanAllResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BlinkyScanAllResult'

    BlinkyRenderSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BlinkyRenderSettings'

    ErrorResponse:
      type: object
      description: Error envelope for 4xx/5xx responses.
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          description: Human-readable error description.
          example: "Vehicle not found: rocket-1."
      required: [status, message]

  responses:
    BadRequest:
      description: Missing or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (vehicle, grid, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Grid already exists for this vehicle and name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
