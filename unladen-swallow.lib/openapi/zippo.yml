openapi: 3.1.0

info:
  title: Unladen Swallow — Zippo Light Control API
  version: 1.0.0
  description: >
    Light control and animation endpoints for the Unladen Swallow RPC server.
    Allows reading and setting light part color/intensity, toggling lights on/off,
    and queuing color+intensity animations with configurable easing.
    Listens on http://localhost:7887.

servers:
  - url: http://localhost:7887
    description: Local KSA mod server

paths:

  /zippo/lights:
    get:
      summary: List light parts on a vehicle
      description: Returns all light parts on the specified vehicle with their current color, intensity, and animation state.
      operationId: listZippoLights
      parameters:
        - name: vehicleId
          in: query
          required: true
          description: The ID of the vehicle to inspect.
          schema:
            type: string
          example: "Rocket-001"
      responses:
        '200':
          description: List of light parts and their current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZippoLightsListResponse'
              examples:
                success:
                  summary: Vehicle with two light parts
                  value:
                    status: "ok"
                    data:
                      vehicleId: "Rocket-001"
                      lights:
                        - partId: "light-nose-001"
                          displayName: "Nose Light"
                          intensity: 0.8
                          color:
                            r: 1.0
                            g: 0.9
                            b: 0.5
                          isEnabled: true
                          isAnimating: false
                          queuedAnimations: 0
                        - partId: "light-engine-001"
                          displayName: "Engine Light"
                          intensity: 1.0
                          color:
                            r: 0.2
                            g: 0.6
                            b: 1.0
                          isEnabled: true
                          isAnimating: true
                          queuedAnimations: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /zippo/lights/state:
    post:
      summary: Set light state
      description: >
        Sets the color, intensity, and/or enabled state on a specific light part.
        Only provided fields are updated; omitted fields are left unchanged.
        Provide `color` OR `colorName` (not both) to change the color.
      operationId: setZippoLightState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZippoSetStateRequest'
            examples:
              setColorByRgb:
                summary: Set color by RGB values
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  color:
                    r: 1.0
                    g: 0.0
                    b: 0.5
                  intensity: 0.9
              setColorByName:
                summary: Set color by XKCD name
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  colorName: "NeonBlue"
              toggleOff:
                summary: Turn light off
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  enabled: false
      responses:
        '200':
          description: Updated light state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZippoSetStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /zippo/animate:
    post:
      summary: Queue a light animation
      description: >
        Queues a single-step animation that interpolates a light part's color and intensity
        from start values to end values over `durationSeconds`.
        If `startColor` or `startIntensity` are omitted, the part's current values are used.
        If `endColor` or `endIntensity` are omitted, current values are used (no change).
        Animations are queued per-part (max 25) and play back-to-back.
        Manual light controls are locked while an animation is active.
      operationId: queueZippoAnimation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZippoAnimateRequest'
            examples:
              fadeToRed:
                summary: Fade to red over 3 seconds
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  durationSeconds: 3.0
                  endColor:
                    rgb:
                      r: 1.0
                      g: 0.0
                      b: 0.0
                  endIntensity: 1.0
                  easing:
                    easing: "EaseInOut"
                    easingPowerStart: 3.0
                    easingPowerEnd: 3.0
              fadeByColorName:
                summary: Fade from current to NeonBlue over 2 seconds
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  durationSeconds: 2.0
                  endColor:
                    colorName: "NeonBlue"
              pulseSequence:
                summary: Fade intensity from 0 to 1 (bright pulse)
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
                  durationSeconds: 0.5
                  startIntensity: 0.0
                  endIntensity: 1.0
                  easing:
                    easing: "EaseOut"
      responses:
        '200':
          description: Animation queued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZippoAnimateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Clear animation queue
      description: Cancels the active and all queued animations for a specific light part.
      operationId: clearZippoAnimationQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZippoClearAnimationRequest'
            examples:
              clear:
                summary: Clear queue for a part
                value:
                  vehicleId: "Rocket-001"
                  partId: "light-nose-001"
      responses:
        '200':
          description: Animation queue cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZippoClearAnimationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  schemas:

    ZippoColor:
      type: object
      required: [r, g, b]
      properties:
        r:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Red channel (0–1).
        g:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Green channel (0–1).
        b:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Blue channel (0–1).

    ZippoLightPartInfo:
      type: object
      required: [partId, displayName, intensity, color, isEnabled, isAnimating, queuedAnimations]
      properties:
        partId:
          type: string
          description: Unique identifier of the part.
        displayName:
          type: string
          description: Human-readable name of the part.
        intensity:
          type: number
          format: float
          description: Current brightness (0–100).
        color:
          $ref: '#/components/schemas/ZippoColor'
        isEnabled:
          type: boolean
          description: Whether the light is currently on.
        isAnimating:
          type: boolean
          description: Whether an animation is currently playing on this part.
        queuedAnimations:
          type: integer
          description: Number of animations queued (not counting the active one).

    ZippoLightsListData:
      type: object
      required: [vehicleId, lights]
      properties:
        vehicleId:
          type: string
        lights:
          type: array
          items:
            $ref: '#/components/schemas/ZippoLightPartInfo'

    ZippoLightsListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/ZippoLightsListData'

    ZippoSetStateRequest:
      type: object
      required: [vehicleId, partId]
      properties:
        vehicleId:
          type: string
          description: The vehicle containing the light part.
        partId:
          type: string
          description: The part to update.
        color:
          $ref: '#/components/schemas/ZippoColor'
          description: Set color by RGB. Mutually exclusive with colorName.
        colorName:
          type: string
          description: Set color by KSAColor.Xkcd name (e.g. "NeonBlue"). Mutually exclusive with color.
          example: "NeonBlue"
        intensity:
          type: number
          format: float
          minimum: 0.0
          maximum: 100.0
          description: Set intensity (0–1). Omit to leave unchanged.
        enabled:
          type: boolean
          description: Toggle light on/off. Omit to leave unchanged.

    ZippoSetStateData:
      type: object
      required: [partId, color, intensity, isEnabled]
      properties:
        partId:
          type: string
        color:
          $ref: '#/components/schemas/ZippoColor'
        intensity:
          type: number
          format: float
        isEnabled:
          type: boolean

    ZippoSetStateResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/ZippoSetStateData'

    ZippoEasingType:
      type: string
      enum: [Linear, EaseIn, EaseOut, EaseInOut]
      description: Easing function type for animation interpolation.
      default: EaseInOut

    ZippoEasingConfig:
      type: object
      properties:
        easing:
          $ref: '#/components/schemas/ZippoEasingType'
        easingPowerStart:
          type: number
          format: double
          default: 3.0
          description: Power parameter for acceleration (EaseIn / EaseInOut first half).
        easingPowerEnd:
          type: number
          format: double
          default: 3.0
          description: Power parameter for deceleration (EaseOut / EaseInOut second half).

    ZippoAnimColor:
      type: object
      description: >
        Color specification for an animation endpoint.
        Provide EITHER `rgb` OR `colorName` — not both.
      properties:
        rgb:
          $ref: '#/components/schemas/ZippoColor'
          description: RGB color value.
        colorName:
          type: string
          description: KSAColor.Xkcd color name (case-insensitive).
          example: "HotPink"

    ZippoAnimateRequest:
      type: object
      required: [vehicleId, partId, durationSeconds]
      properties:
        vehicleId:
          type: string
          description: Vehicle containing the light part.
        partId:
          type: string
          description: The light part to animate.
        durationSeconds:
          type: number
          format: double
          minimum: 0.001
          description: Duration of the animation in seconds.
        startColor:
          $ref: '#/components/schemas/ZippoAnimColor'
          description: Starting color. Defaults to current part color if omitted.
        endColor:
          $ref: '#/components/schemas/ZippoAnimColor'
          description: Ending color. Defaults to current part color if omitted.
        startIntensity:
          type: number
          format: float
          description: Starting intensity (0–100). Defaults to current intensity if omitted.
        endIntensity:
          type: number
          format: float
          description: Ending intensity (0–100). Defaults to current intensity if omitted.
        easing:
          $ref: '#/components/schemas/ZippoEasingConfig'
          description: Easing configuration. Defaults to EaseInOut with power 3.0/3.0.

    ZippoAnimateData:
      type: object
      required: [partId, status, queuePosition]
      properties:
        partId:
          type: string
        status:
          type: string
          example: queued
        queuePosition:
          type: integer
          description: Position in the queue (0 = now active, 1+ = waiting).

    ZippoAnimateResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/ZippoAnimateData'

    ZippoClearAnimationRequest:
      type: object
      required: [vehicleId, partId]
      properties:
        vehicleId:
          type: string
        partId:
          type: string

    ZippoClearAnimationData:
      type: object
      required: [partId, status]
      properties:
        partId:
          type: string
        status:
          type: string
          example: cleared

    ZippoClearAnimationResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/ZippoClearAnimationData'

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Vehicle or part not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Animation queue is full (max 25 entries per part).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Zippo mod is not loaded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
