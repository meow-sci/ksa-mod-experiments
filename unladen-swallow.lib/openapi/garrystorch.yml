openapi: 3.1.0

info:
  title: Unladen Swallow — Garry's Torch API
  version: 1.0.0
  description: >
    Vehicle welding (Garry's Torch) endpoints for the Unladen Swallow RPC server.
    Allows creating, modifying, animating, and removing welds between vehicles,
    as well as managing named weld presets.
    Listens on http://localhost:7887.

servers:
  - url: http://localhost:7887
    description: Local KSA mod server

paths:

  /torch/welds:
    get:
      summary: List active welds
      description: Returns the list of all currently active vehicle welds.
      operationId: listWelds
      responses:
        '200':
          description: List of active welds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeldListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create a new weld
      description: >
        Creates a new weld between two vehicles. Supply either `data` (inline weld
        configuration) or `presetName` (the name of a saved preset) — not both.
      operationId: createWeld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeldRequest'
            examples:
              withInlineData:
                summary: Create weld with inline data
                value:
                  sourceVehicleId: "vehicle-001"
                  targetVehicleId: "vehicle-002"
                  data:
                    position:
                      x: 0.0
                      y: 2.5
                      z: 0.0
                    rotation:
                      x: 0.0
                      y: 0.0
                      z: 0.0
                    scale: 1.0
                    lockRotation: true
              withPreset:
                summary: Create weld from a saved preset
                value:
                  sourceVehicleId: "vehicle-001"
                  targetVehicleId: "vehicle-002"
                  presetName: "docking-clamp"
      responses:
        '200':
          description: The newly created weld.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeldInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Remove a weld
      description: Unweleds the vehicle identified by `sourceVehicleId`.
      operationId: deleteWeld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWeldRequest'
      responses:
        '200':
          description: Confirmation that the weld was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /torch/welds/modify:
    post:
      summary: Modify an existing weld
      description: >
        Immediately updates one or more properties of an existing weld.
        Only fields that are present and non-null in the request body are applied;
        omitted fields are left unchanged.
      operationId: modifyWeld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyWeldRequest'
            examples:
              partialUpdate:
                summary: Move weld and change scale, leave rotation and lockRotation unchanged
                value:
                  sourceVehicleId: "vehicle-001"
                  position:
                    x: 0.0
                    y: 3.0
                    z: 0.5
                  scale: 1.5
      responses:
        '200':
          description: The updated weld state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeldInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /torch/welds/animate:
    post:
      summary: Animate a weld to a target state
      description: >
        Starts an animated interpolation of a weld from its current state to the
        target state over the given duration. If an animation is already playing for
        this weld the new animation is queued and will start when the current one
        finishes. Supply either `data` or `presetName` for the target state — not both.
      operationId: animateWeld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimateWeldRequest'
            examples:
              animateWithData:
                summary: Animate to an inline target state with custom easing
                value:
                  sourceVehicleId: "vehicle-001"
                  durationSeconds: 2.5
                  data:
                    position:
                      x: 0.0
                      y: 5.0
                      z: 0.0
                    rotation:
                      x: 0.0
                      y: 45.0
                      z: 0.0
                    scale: 1.2
                    lockRotation: true
                  easing:
                    easing: easeInOut
                    easingPowerStart: 3.0
                    easingPowerEnd: 3.0
      responses:
        '200':
          description: Animation queued confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimateWeldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /torch/presets:
    get:
      summary: List weld presets
      description: Returns all saved weld presets.
      operationId: listPresets
      responses:
        '200':
          description: List of saved presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Save or update a preset
      description: >
        Creates a new named preset or overwrites an existing one with the same name.
      operationId: savePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePresetRequest'
      responses:
        '200':
          description: The saved preset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete a preset
      description: Deletes the named preset. Returns 404 if no preset with that name exists.
      operationId: deletePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePresetRequest'
      responses:
        '200':
          description: Confirmation that the preset was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  schemas:

    # -------------------------------------------------------------------------
    # Primitive / shared types
    # -------------------------------------------------------------------------

    Vec3:
      type: object
      description: A 3-component vector. Used for position (metres) and rotation (degrees).
      properties:
        x:
          type: number
          format: float
          example: 0.0
        y:
          type: number
          format: float
          example: 2.5
        z:
          type: number
          format: float
          example: 0.0
      required:
        - x
        - y
        - z

    TorchEasingType:
      type: string
      description: Easing curve to use for weld animations.
      enum:
        - linear
        - easeIn
        - easeOut
        - easeInOut
      example: easeInOut

    TorchEasingConfig:
      type: object
      description: >
        Easing configuration for animated weld transitions. All fields are optional
        and fall back to their defaults when omitted.
      properties:
        easing:
          $ref: '#/components/schemas/TorchEasingType'
        easingPowerStart:
          type: number
          format: float
          description: Exponent controlling the shape of the ease-in curve.
          default: 3.0
          example: 3.0
        easingPowerEnd:
          type: number
          format: float
          description: Exponent controlling the shape of the ease-out curve.
          default: 3.0
          example: 3.0

    WeldData:
      type: object
      description: Configuration parameters that define a weld's spatial state.
      properties:
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Vec3'
        scale:
          type: number
          format: float
          description: Uniform scale factor. Valid range 0.05 – 20.0.
          default: 1.0
          minimum: 0.05
          maximum: 20.0
          example: 1.0
        lockRotation:
          type: boolean
          description: Whether the weld locks the relative rotation between vehicles.
          default: true
          example: true
      required:
        - position
        - rotation

    WeldInfo:
      type: object
      description: Full state of an active weld returned in responses.
      properties:
        sourceVehicleId:
          type: string
          description: ID of the source (child) vehicle.
          example: "vehicle-001"
        targetVehicleId:
          type: string
          description: ID of the target (parent) vehicle.
          example: "vehicle-002"
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Vec3'
        scale:
          type: number
          format: float
          example: 1.0
        lockRotation:
          type: boolean
          example: true
      required:
        - sourceVehicleId
        - targetVehicleId
        - position
        - rotation
        - scale
        - lockRotation

    TorchPresetInfo:
      type: object
      description: A named weld preset.
      properties:
        name:
          type: string
          description: Unique name identifying the preset.
          example: "docking-clamp"
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Vec3'
        scale:
          type: number
          format: float
          example: 1.0
        lockRotation:
          type: boolean
          example: true
      required:
        - name
        - position
        - rotation
        - scale
        - lockRotation

    # -------------------------------------------------------------------------
    # Request bodies
    # -------------------------------------------------------------------------

    CreateWeldRequest:
      type: object
      description: >
        Request body for creating a new weld. Provide either `data` or `presetName`
        to specify the weld configuration — not both.
      properties:
        sourceVehicleId:
          type: string
          description: ID of the source (child) vehicle to weld.
          example: "vehicle-001"
        targetVehicleId:
          type: string
          description: ID of the target (parent) vehicle to weld to.
          example: "vehicle-002"
        data:
          $ref: '#/components/schemas/WeldData'
        presetName:
          type: string
          description: Name of a saved preset to use for the weld configuration.
          example: "docking-clamp"
      required:
        - sourceVehicleId
        - targetVehicleId

    DeleteWeldRequest:
      type: object
      description: Identifies the weld to remove.
      properties:
        sourceVehicleId:
          type: string
          description: ID of the source vehicle whose weld should be removed.
          example: "vehicle-001"
      required:
        - sourceVehicleId

    ModifyWeldRequest:
      type: object
      description: >
        Partial update for an existing weld. Only fields present and non-null
        in the request are applied; omitted fields retain their current values.
      properties:
        sourceVehicleId:
          type: string
          description: ID of the source vehicle whose weld should be modified.
          example: "vehicle-001"
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Vec3'
        scale:
          type: number
          format: float
          description: New scale value. Omit to leave unchanged.
          minimum: 0.05
          maximum: 20.0
          example: 1.5
        lockRotation:
          type: boolean
          description: New lockRotation value. Omit to leave unchanged.
          example: true
      required:
        - sourceVehicleId

    AnimateWeldRequest:
      type: object
      description: >
        Request body for animating a weld to a target state. Provide either
        `data` or `presetName` to specify the target configuration — not both.
      properties:
        sourceVehicleId:
          type: string
          description: ID of the source vehicle whose weld should be animated.
          example: "vehicle-001"
        durationSeconds:
          type: number
          format: float
          description: Duration of the animation in seconds.
          example: 2.5
        data:
          $ref: '#/components/schemas/WeldData'
        presetName:
          type: string
          description: Name of a saved preset to animate towards.
          example: "docking-clamp"
        easing:
          $ref: '#/components/schemas/TorchEasingConfig'
      required:
        - sourceVehicleId
        - durationSeconds

    SavePresetRequest:
      type: object
      description: Creates or overwrites a named weld preset.
      properties:
        name:
          type: string
          description: Name for the preset. Overwrites any existing preset with the same name.
          example: "docking-clamp"
        data:
          $ref: '#/components/schemas/WeldData'
      required:
        - name
        - data

    DeletePresetRequest:
      type: object
      description: Identifies the preset to delete.
      properties:
        name:
          type: string
          description: Name of the preset to delete.
          example: "docking-clamp"
      required:
        - name

    # -------------------------------------------------------------------------
    # Response data payloads
    # -------------------------------------------------------------------------

    WeldListData:
      type: object
      properties:
        welds:
          type: array
          items:
            $ref: '#/components/schemas/WeldInfo'
      required:
        - welds

    WeldInfoData:
      type: object
      properties:
        weld:
          $ref: '#/components/schemas/WeldInfo'
      required:
        - weld

    AnimateWeldData:
      type: object
      properties:
        sourceVehicleId:
          type: string
          example: "vehicle-001"
        status:
          type: string
          example: "animation_queued"
      required:
        - sourceVehicleId
        - status

    MessageData:
      type: object
      properties:
        message:
          type: string
          example: "Weld removed."
      required:
        - message

    PresetListData:
      type: object
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/TorchPresetInfo'
      required:
        - presets

    PresetInfoData:
      type: object
      properties:
        preset:
          $ref: '#/components/schemas/TorchPresetInfo'
      required:
        - preset

    # -------------------------------------------------------------------------
    # Typed response envelopes (ApiResponseBase + data specialisation)
    # -------------------------------------------------------------------------

    WeldListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WeldListData'

    WeldInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WeldInfoData'

    AnimateWeldResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AnimateWeldData'

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageData'

    PresetListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PresetListData'

    PresetInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PresetInfoData'

    # -------------------------------------------------------------------------
    # Common / base schemas
    # -------------------------------------------------------------------------

    ApiResponseBase:
      type: object
      description: Standard API response envelope wrapping all successful responses.
      properties:
        status:
          type: string
          description: Always `"ok"` for successful responses.
          example: ok
        data:
          description: The response payload. Type depends on the endpoint.
      required:
        - status
        - data

    ErrorResponse:
      type: object
      description: Error response envelope returned on 4xx/5xx.
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          description: Human-readable description of the error.
          example: "An unexpected error occurred."
      required:
        - status
        - message

  responses:

    BadRequest:
      description: Bad request — missing or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The requested resource (weld, preset, or vehicle) was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: The Garry's Torch mod is not currently loaded or available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
